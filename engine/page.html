<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:F;src:url(assets/Fredoka-Bold.ttf);font-weight:700}
@font-face{font-family:F;src:url(assets/Fredoka-SemiBold.ttf);font-weight:600}
@font-face{font-family:F;src:url(assets/Fredoka-Medium.ttf);font-weight:500}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:F;background:#3A2418}
.a{position:absolute}.L{position:absolute;inset:0;overflow:hidden}
</style></head><body><div id="root" class="L"></div>
<script>
const P=PLAN, POPS=P.pops;
const cl=x=>Math.min(1,Math.max(0,x)),ease=x=>{x=cl(x);return x*x*(3-2*x)},eout=x=>{x=cl(x);return 1-Math.pow(1-x,4)},ein=x=>{x=cl(x);return x*x*x},
back=x=>{x=cl(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},
elas=x=>{x=cl(x);if(x==0||x==1)return x;return Math.pow(2,-10*x)*Math.sin((x*10-0.75)*2*Math.PI/3)+1};
// identidad Clickly
const INK='#3A2418',ACC='#F6884C',ACC2='#E06D32',CREAM='#FEDFA2',PAPER='#FFF6E4',CEL='#74ACDF',SUN='#F6B40E',PINK='#F06A8C',BLUE='#2F6FE0';
const cv=document.createElement('canvas').getContext('2d');
function fit(t,base,maxw=860){let s=base;cv.font=`700 ${s}px F`;while(cv.measureText(t).width>maxw&&s>40){s-=4;cv.font=`700 ${s}px F`}return s}
function seg(t){let i=0;for(let k=0;k<P.st.length;k++)if(P.st[k]<=t)i=k;return i}
function rays(cx,cy,rot,col,a){return `<div class="a" style="left:${cx-1400}px;top:${cy-1400}px;width:2800px;height:2800px;opacity:${a};background:repeating-conic-gradient(from ${rot}deg,${col} 0deg 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 0%,transparent 60%)"></div>`}
function dust(t,col,seed=1){let h='';for(let i=0;i<24;i++){const r=Math.sin(i*91.7+seed)*43758.5;const fx=r-Math.floor(r);const r2=Math.sin(i*12.9+seed*3)*9871.3;const fy=r2-Math.floor(r2);
 const x=fx*1080,y=((fy*1920-t*(40+fx*80))%1920+1920)%1920,s=6+fx*14;h+=`<div class="a" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;border-radius:50%;background:${col};opacity:${0.25+0.4*fy}"></div>`}return h}
function burst(d,x,y,txt='CLIC!',sc=1){if(d<0||d>0.75)return'';const k=back(d/0.16)*sc,a=1-cl((d-0.5)/0.25);let pts=[];for(let i=0;i<24;i++){const r=i%2?92:150,an=i*Math.PI/12+.2;pts.push(`${150+r*Math.cos(an)},${150+r*Math.sin(an)}`)}
 let p='';for(let i=0;i<18;i++){const an=i/18*2*Math.PI+0.2,dd=80+420*eout(d/0.7),s=26*(1-cl(d/0.7));p+=`<div class="a" style="left:${x+Math.cos(an)*dd-s/2}px;top:${y+Math.sin(an)*dd-s/2}px;width:${s}px;height:${s}px;border-radius:${i%2?'50%':'4px'};transform:rotate(${d*400}deg);background:${[SUN,'#fff',CREAM,ACC][i%4]}"></div>`}
 const ring=eout(d/0.45),ra=1-cl(d/0.45);
 return `<div class="a" style="left:${x-60-360*ring}px;top:${y-60-360*ring}px;width:${120+720*ring}px;height:${120+720*ring}px;border-radius:50%;border:${14*ra+1}px solid rgba(255,255,255,${ra})"></div>`+p+
 `<div class="a" style="left:${x-150}px;top:${y-150}px;width:300px;height:300px;transform:scale(${k}) rotate(${-12+10*d}deg);opacity:${a}"><svg width="300" height="300"><polygon points="${pts.join(' ')}" fill="${CREAM}" stroke="${INK}" stroke-width="9" stroke-linejoin="round"/></svg><div class="a" style="inset:0;display:flex;align-items:center;justify-content:center;font:700 74px F;color:${INK};transform:rotate(-8deg)">${txt}</div></div>`}
function squash(t,c){const d=t-c;if(d>=-0.07&&d<0)return (d+0.07)/0.07;if(d>=0&&d<0.7)return 1-elas(d/0.7);return 0}
function prod(n,x,y,size,ry,rz,s,a=1){return `<div class="a" style="left:${x-size/2}px;top:${y-size/2}px;width:${size}px;height:${size}px;perspective:1400px;opacity:${a}">
 <img src="assets/img_${n}.png" style="position:absolute;inset:0;width:100%;height:100%;transform:rotateY(${ry}deg) rotateZ(${rz}deg) scale(${1+0.07*s},${1-0.12*s});transform-origin:50% 85%"></div>`}
function marquee(word,t,col,y,dir,size=280){const s=`${word} ✦ `.repeat(6);const off=((t*160*dir)%1700+1700)%1700;return `<div class="a" style="left:${-off}px;top:${y}px;white-space:nowrap;font:700 ${size}px/1 F;color:transparent;-webkit-text-stroke:5px ${col}">${s}${s}</div>`}
function reveal(text,lt,{x=90,y=260,size=130,color='#fff',bg=null,dly=0,maxw=860}={}){const k=eout((lt-dly)/0.4);const w=fit(text,size,maxw);
 return `<div class="a" style="left:${x}px;top:${y}px;clip-path:inset(-20px ${100-100*k}% -20px -20px);"><div style="font:700 ${w}px/1.08 F;color:${color};letter-spacing:-1px;transform:translateX(${(1-k)*-80}px);${bg?`background:${bg};padding:4px 22px 10px;border-radius:22px;`:''}">${text}</div></div>`}
function chip(text,lt,dly,x,y,bg,fg,size=36){const k=eout((lt-dly)/0.3);return `<div class="a" style="left:${x}px;top:${y}px;opacity:${cl((lt-dly)/0.2)};transform:translateY(${(1-k)*30}px);background:${bg};color:${fg};font:600 ${size}px F;padding:10px 26px;border-radius:40px">${text}</div>`}
function subs(i,lt){const W=P.words[i];if(!W||!W.length)return'';const chunks=[];let cur=[];W.forEach((w,k)=>{cur.push(w);if(cur.length>=3||/[.,?!:]$/.test(w.w)||k==W.length-1){chunks.push(cur);cur=[]}});
 let ch=null;for(const c of chunks){if(lt>=c[0].t0-0.05)ch=c}if(!ch)return'';if(lt>ch[ch.length-1].t1+0.6)return'';
 let h='';ch.forEach(w=>{const on=lt>=w.t0-0.03,act=on&&lt<w.t1+0.05,kk=back((lt-w.t0+0.03)/0.18);if(!on)return;
  h+=`<span style="display:inline-block;margin:0 8px;padding:0 16px 6px;border-radius:16px;transform:scale(${0.5+0.5*kk}) rotate(${act?-2:0}deg);background:${act?CREAM:'transparent'};color:${act?INK:'#fff'}">${w.w.toUpperCase()}</span>`});
 return `<div class="a" style="left:60px;top:1300px;width:800px;text-align:center;font:700 68px/1.2 F;text-shadow:0 6px 0 rgba(58,36,24,.35),0 0 30px rgba(58,36,24,.25)">${h}</div>`}
function bgPop(c,c2){return `<div class="a" style="inset:0;background:radial-gradient(90% 60% at 50% 46%,${c} 0%,${c2} 100%)"></div>`}
function clicksIn(i){return P.clicks.filter(c=>c.s===i)}
function scene(i,lt,t){const S=P.scenes[i],ty=S.type;let h='';
 if(ty==='hook'){const e=k=>eout((lt-k*0.1)/0.45);
  h+=`<div class="a" style="inset:0;background:${PAPER}"></div><div class="a" style="left:-300px;top:-300px;width:1680px;height:2520px;transform:rotate(-12deg)">`;
  [0,1,2,3,4].forEach(k=>{h+=`<div class="a" style="left:${(k%2?1:-1)*(1-e(k))*1800}px;top:${k*504}px;width:1680px;height:504px;background:${k%2?PAPER:CREAM}"></div>`});h+='</div>';
  h+=rays(540,1080,t*20,'rgba(246,136,76,.16)',cl((lt-0.4)/0.4));
  const st=[[INK,PAPER],['#fff',INK],[INK,ACC]];let y=230;
  (S.lines||[]).forEach((ln,k)=>{const sz=k==1?150:96;const [fg,bg]=st[k%3];h+=reveal(ln,lt,{y,size:sz,color:fg,bg,dly:0.15+k*0.32});y+=fit(ln,sz)*1.08+40});
  const ps=S.pops||[];ps.forEach((n,k)=>{const tt=lt-1.2-k*0.18;if(tt<0)return;const fx=ps.length==1?540:[260,540,820][k%3];const kk=back(tt/0.45);
   const c=clicksIn(i)[k];const s=c?squash(t,c.t):0;h+=prod(n,fx,1180+Math.sin(t*4+k)*14,ps.length==1?560:320*kk,Math.sin(t*2+k)*18,(k-1)*10,s);if(c)h+=burst(t-c.t,fx,1000,'CLIC!',0.6)});
 } else if(ty==='pop'||ty==='card'){const p=POPS[S.pop]||{c:ACC,c2:ACC2,word:'CLICKLY'};
  h+=bgPop(p.c,p.c2)+rays(540,960,t*14,'rgba(255,255,255,.08)',1);
  h+=marquee(S.word||p.word||'CLICKLY',t,'rgba(255,255,255,.18)',ty==='card'?760:420,1)+marquee(S.word||p.word||'CLICKLY',t,'rgba(255,255,255,.11)',1150,-1);
  h+=dust(t,'rgba(255,255,255,.7)',i*3+1);
  const e=back((lt-0.05)/0.5);let s=0;const cs=clicksIn(i);cs.forEach(c=>s=Math.max(s,squash(t,c.t)));
  if(S.pop){const py=ty==='card'?1050:900,sz=ty==='card'?600:760;h+=prod(S.pop,540,py+(1-e)*900+Math.sin(t*2.4)*16,sz,Math.sin(t*1.8)*16+(1-e)*-70,Math.sin(t*1.3)*3+(1-e)*-25,s);cs.forEach(c=>h+=burst(t-c.t,790,py-280))}
  if(S.num)h+=`<div class="a" style="left:90px;top:226px;font:700 60px F;color:rgba(255,255,255,.9);opacity:${cl(lt/0.2)}">${S.num}<span style="opacity:.5">/${S.of||'03'}</span></div>`;
  if(S.kicker)h+=chip(S.kicker,lt,0.05,90,310,'#fff',INK,34);
  const ty0=S.kicker?390:300;
  h+=reveal(S.title||p.name||'',lt,{y:ty0,size:ty==='card'?120:140,color:'#fff',dly:0.1});
  if(S.sub)h+=reveal(S.sub,lt,{y:ty0+150,size:62,color:INK,bg:CREAM,dly:0.4});
  if(S.stat){const k=back((lt-0.5)/0.4);h+=`<div class="a" style="right:70px;top:${ty0+260}px;transform:scale(${k}) rotate(6deg);background:${INK};color:${CREAM};font:700 64px F;padding:14px 30px;border-radius:30px">${S.stat}</div>`}
 } else if(ty==='list'){h+=`<div class="a" style="inset:0;background:${PAPER}"></div>`+rays(540,1500,t*12,'rgba(246,136,76,.10)',1);
  h+=reveal(S.title||'',lt,{y:230,size:110,color:INK,dly:0});
  (S.items||[]).forEach((it,k)=>{const d=0.35+k*Math.max(0.35,(P.d[i]-1)/Math.max(1,S.items.length)*0.8),kk=back((lt-d)/0.4);if(kk<=0.01)return;
   h+=`<div class="a" style="left:80px;top:${450+k*190}px;width:920px;height:160px;transform:translateX(${(1-kk)*-900}px);display:flex;align-items:center;gap:30px;background:${k%2?CREAM:'#fff'};border-radius:36px;box-sizing:border-box;padding:0 36px">
    <div style="flex:none;width:100px;height:100px;border-radius:50%;background:${ACC};color:#fff;font:700 56px/100px F;text-align:center">${k+1}</div><div style="font:600 ${fit(it,58,720)}px/1.1 F;color:${INK}">${it}</div></div>`});
  if(S.pop){const cs=clicksIn(i);let s=0;cs.forEach(c=>s=Math.max(s,squash(t,c.t)));const e=back((lt-0.6)/0.5);h+=prod(S.pop,800,1500+(1-e)*600,420,Math.sin(t*2)*14,8,s);cs.forEach(c=>h+=burst(t-c.t,780,1300,'CLIC!',0.7))}
 } else if(ty==='trio'){h+=`<div class="a" style="inset:0;background:radial-gradient(90% 60% at 50% 46%,#FFC49A 0%,${ACC} 55%,${ACC2} 100%)"></div>`;
  h+=rays(540,960,t*25,'rgba(255,255,255,.14)',1)+dust(t,'rgba(255,255,255,.8)',7);const cs=clicksIn(i);
  (S.pops||[]).slice(0,3).forEach((n,k)=>{const e=back((lt-k*0.1)/0.45);const c=cs[k];const s=c?squash(t,c.t):0;
   const x=[270,540,810][k],y=[1030,860,1030][k];if(e>0.01)h+=prod(n,x,y+Math.sin(t*3+k)*14+(1-e)*600,440,Math.sin(t*2+k)*15,[-8,0,8][k],s);if(c)h+=burst(t-c.t,x,y-190,'CLIC!',0.7)});
  const T=S.title||['CLICKLY','POPS'];h+=reveal(T[0],lt,{y:240,size:120,color:INK,dly:0})+reveal(T[1]||'',lt,{y:380,size:150,color:'#fff',bg:INK,dly:0.25});
 } else if(ty==='cta'){h+=`<div class="a" style="inset:0;background:radial-gradient(90% 60% at 50% 40%,#5a3826 0%,${INK} 70%)"></div>`;
  const im=cl(1-lt/0.25);h+=rays(540,760,t*30,'rgba(246,136,76,.25)',1);
  const ps=S.pops||['base','mate','heart'];ps.slice(0,3).forEach((n,k)=>{const an=k/3*2*Math.PI+lt*1.1;const e=back((lt-0.1-k*0.08)/0.4);if(e>0.01)h+=prod(n,540+Math.cos(an)*290,720+Math.sin(an)*120,250*e,Math.sin(t*3+k)*20,0,0)});
  const B=S.big||['PREVENTA','ABIERTA'];const k1=back((lt-0.05)/0.35),k2=back((lt-0.2)/0.35);
  h+=`<div class="a" style="left:0;top:960px;width:1080px;text-align:center;font:700 ${fit(B[0],170,980)}px/1 F;color:${PAPER};transform:scale(${k1})">${B[0]}</div>`;
  h+=`<div class="a" style="left:0;top:1120px;width:1080px;text-align:center;font:700 ${fit(B[1]||'',170,980)}px/1 F;color:${ACC};transform:scale(${k2})">${B[1]||''}</div>`;
  const a=back((lt-0.9)/0.35);h+=`<div class="a" style="left:0;top:1330px;width:1080px;display:flex;justify-content:center;transform:scale(${a})"><div style="background:${CREAM};color:${INK};font:700 ${fit(S.chip||'Escribí PREVENTA por DM 💬',54,860)}px F;padding:18px 40px 22px;border-radius:60px;transform:rotate(${-2+2*Math.sin(t*5)}deg)">${S.chip||'Escribí PREVENTA por DM 💬'}</div></div>`;
  h+=`<div class="a" style="inset:0;background:#fff;opacity:${im*0.8}"></div>`;
 } else if(ty==='logo'){h+=`<div class="a" style="inset:0;background:radial-gradient(90% 60% at 50% 46%,#FFFFFF 0%,${PAPER} 50%,${CREAM} 100%)"></div>`;
  const L=P.logo,FW=880,sc=FW/L.w,FH=L.h*sc,x0=(1080-FW)/2,y0=900-FH/2;const s=squash(t,P.logoclick);const d=t-P.logoclick;
  const seeds=[[-520,-700,-80],[300,-820,60],[620,-300,120],[-640,250,-140],[560,520,90],[-200,760,-60],[700,820,150]];
  h+=`<div class="a" style="left:${x0}px;top:${y0}px;width:${FW}px;height:${FH}px;transform:scale(${1+0.06*s},${1-0.12*s});transform-origin:50% 90%">`;
  L.segs.forEach(([a,b],k)=>{const tt=lt-0.1-k*0.075,e=back(tt/0.5),p=cl(tt/0.1);const [dx,dy,r]=seeds[k];
   h+=`<img src="assets/L${k}.png" class="a" style="left:${a*sc}px;top:0;width:${(b-a)*sc}px;height:${FH}px;opacity:${p};transform:translate(${dx*(1-e)}px,${dy*(1-e)}px) rotate(${r*(1-e)}deg) scale(${0.3+0.7*e})">`});
  h+='</div>';
  if(d>=0&&d<0.8){const ring=eout(d/0.6),ra=1-cl(d/0.6);h+=`<div class="a" style="left:${540-200-500*ring}px;top:${900-200-500*ring}px;width:${400+1000*ring}px;height:${400+1000*ring}px;border-radius:50%;border:${18*ra}px solid rgba(246,136,76,${ra})"></div>`;
   for(let j=0;j<16;j++){const an=j/16*2*Math.PI,dd=300+300*eout(d/0.7),z=22*(1-cl(d/0.7));h+=`<div class="a" style="left:${540+Math.cos(an)*dd*1.3-z/2}px;top:${900+Math.sin(an)*dd*0.8-z/2}px;width:${z}px;height:${z}px;border-radius:50%;background:${j%2?ACC:SUN}"></div>`}}
  const ta=cl((lt-1.55)/0.3);h+=`<div class="a" style="left:0;top:${1080+(1-eout((lt-1.55)/0.4))*30}px;width:1080px;text-align:center;font:600 56px F;color:${INK};opacity:${ta}">${S.tag||'Apretás, hace clic.'}</div>`;
 }
 return h}
window.render=(t)=>{const i=seg(t),lt=t-P.st[i];const TR=0.32;let h='';
 let sh=0;for(const c of P.clicks.map(c=>c.t).concat([P.logoclick])){const d=t-c;if(d>=0&&d<0.25)sh=Math.max(sh,1-d/0.25)}
 const zx=Math.sin(t*37)*14*sh,zy=Math.cos(t*41)*14*sh,zs=1+0.05*ease(lt/P.d[i])+0.03*sh;
 const end=P.st[i]+P.d[i];const nx=i+1<P.scenes.length?i+1:null;const nextLogo=nx!==null&&P.scenes[nx].type==='logo';
 const TRi=nextLogo?0.45:TR;const inT=nx!==null&&end-t<TRi;const k=inT?ein(1-(end-t)/TRi):0;
 if(inT&&nextLogo){h=`<div class="L" style="transform:translate(${zx}px,${zy}px) scale(${zs+0.3*k})">${scene(i,lt,t)}</div>`;const r=1400*k;h+=`<div class="a" style="left:${540-r-30}px;top:${960-r-30}px;width:${2*r+60}px;height:${2*r+60}px;border-radius:50%;background:${ACC}"></div><div class="a" style="left:${540-r}px;top:${960-r}px;width:${2*r}px;height:${2*r}px;border-radius:50%;background:${PAPER}"></div>`}
 else{h+=`<div class="L" style="transform:translate(${zx-k*1080*0.9}px,${zy}px) scale(${zs});filter:blur(${k*40}px)">${scene(i,lt,t)}</div>`;
  if(inT)h+=`<div class="L" style="transform:translate(${1080*(1-k)*0.9}px,0);filter:blur(${(1-k)*40}px)">${scene(nx,t-end,t)}</div>`}
 h+=`<div class="L" style="background:radial-gradient(120% 80% at 50% 50%,transparent 60%,rgba(58,36,24,.25))"></div>`;
 const ty=P.scenes[i].type;if(ty!=='hook'&&ty!=='cta'&&ty!=='logo'&&ty!=='list')h+=subs(i,lt);
 document.getElementById('root').innerHTML=h};
window.ready=true;
</script></body></html>
